<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kevin's card · QR</title>
<style>
  html,body{margin:0;height:100%;background:#e03c2b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
  .qrbox{background:#fff;border-radius:22px;padding:22px}
  .qrbox canvas,.qrbox img{display:block}
  h1{margin:0;font-size:22px}
  p{margin:0;opacity:.9;font-size:15px}
  .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  .btn{background:#fff;color:#e03c2b;border:0;border-radius:999px;padding:12px 18px;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;font-family:inherit}
  .btn.ghost{background:transparent;color:#fff;border:1.5px solid #fff}
  small{opacity:.85;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Kevin LeBaron</h1>
  <p>Scan to get my card</p>
  <div class="qrbox"><div id="qr"></div></div>
  <div class="btns">
    <button class="btn" id="copy">Copy link</button>
    <a class="btn ghost" id="sms" href="#">Text my card</a>
    <button class="btn ghost" id="save">Save QR picture</button>
  </div>
  <small id="url"></small>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const CARD=new URL('index.html',location.href).href.replace(/index\.html$/,'');
  document.getElementById('url').textContent=CARD;
  const size=Math.min(300,Math.floor(window.innerWidth*0.66));
  new QRCode(document.getElementById('qr'),{text:CARD,width:size,height:size,correctLevel:QRCode.CorrectLevel.M,colorDark:'#111111',colorLight:'#ffffff'});
  document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(CARD);document.getElementById('copy').textContent='Copied'}catch(e){prompt('Copy this link',CARD)}};
  document.getElementById('sms').href='sms:?&body='+encodeURIComponent("Here's my card: "+CARD);
  document.getElementById('save').onclick=()=>{
    const src=document.querySelector('#qr canvas')||document.querySelector('#qr img');
    const m=140,s=900,c=document.createElement('canvas');c.width=s+2*m;c.height=s+2*m+120;
    const x=c.getContext('2d');x.fillStyle='#e03c2b';x.fillRect(0,0,c.width,c.height);
    x.fillStyle='#fff';x.beginPath();x.roundRect(m-40,m-40,s+80,s+80,48);x.fill();
    x.drawImage(src,m,m,s,s);
    x.fillStyle='#fff';x.font='bold 56px -apple-system,Helvetica,Arial';x.textAlign='center';x.fillText('Kevin LeBaron · scan for my card',c.width/2,c.height-40);
    const a=document.createElement('a');a.download='kevin-card-qr.png';a.href=c.toDataURL('image/png');a.click();
  };
</script>
</body>
</html>
